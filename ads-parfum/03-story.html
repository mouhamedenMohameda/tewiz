<meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
html,body,.scene{width:1080px;height:1920px;}
body{background:var(--noir);}
.scene{display:flex;flex-direction:column;background:#0A0705;}

.haut{position:relative;height:1010px;flex:none;}
.haut>img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;}
.haut::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,7,5,.42) 0%,transparent 22%,rgba(10,7,5,.10) 52%,#0A0705 99%);}

.marque{position:absolute;top:70px;right:60px;z-index:3;display:flex;align-items:center;gap:18px;}
.marque img{width:96px;height:96px;box-shadow:0 0 0 1px rgba(216,180,95,.6),0 10px 34px rgba(0,0,0,.5);}
.marque b{font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);}

.corps{position:relative;z-index:2;margin-top:-190px;padding:0 76px 74px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;}
.hook{font-size:66px;font-weight:900;line-height:1.24;color:var(--creme);text-shadow:0 6px 30px rgba(0,0,0,.6);}
.hook em{font-style:normal;}
.rep{margin-top:20px;font-size:34px;font-weight:700;color:rgba(248,241,230,.66);}

.trio{margin-top:44px;display:flex;gap:20px;width:100%;}
.trio div{flex:1;height:250px;border-radius:20px;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px rgba(216,180,95,.42),0 20px 44px rgba(0,0,0,.55);}
.trio img{width:100%;height:100%;object-fit:cover;}
.trio p{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 12px;font-size:24px;font-weight:700;color:#F3E7CE;
  background:linear-gradient(180deg,transparent,rgba(8,5,4,.88));}

.lignes{margin-top:40px;display:flex;flex-direction:column;gap:14px;width:100%;}
.lignes span{font-size:31px;font-weight:700;color:rgba(248,241,230,.82);
  padding:16px 0;border-top:1px solid rgba(216,180,95,.22);}
.lignes span:last-child{border-bottom:1px solid rgba(216,180,95,.22);}

.bas{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:44px;}
</style>
<div class="scene">
  <div class="cadre" style="inset:26px;"></div>

  <div class="haut">
    <img src="assets/p4.jpg">
    <div class="marque"><img class="logo" src="assets/logo.jpg"><b>لمسة عطر</b></div>
  </div>

  <div class="corps">
    <h1 class="hook">ريحة تدوم…<br><em class="or-txt">وتخلّي الكل يسأل</em></h1>
    <p class="rep">«شنو عطرك؟» 😍</p>

    <div class="trio">
      <div><img src="assets/p3.jpg"><p>مقشر الكركديه</p></div>
      <div><img src="assets/lineup_ccw.jpg"><p>المجموعة كاملة</p></div>
      <div><img src="assets/p1.jpg"><p>٥ منتجات</p></div>
    </div>

    <div class="lignes">
      <span>تقشير · ترطيب · نعومة · عطر يدوم</span>
      <span>التوصيل داخل نواكشوط</span>
    </div>

    <div class="bas">
      <div class="pastille-prix"><span class="l">المجموعة كاملة</span><span class="n">11</span><span class="u">ألف أوقية</span></div>
      <div class="wa">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.6 14.2c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.5-1.2-2.9 0-1.4.7-2 1-2.3.2-.3.5-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.2 1.4 2.5 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2 1c.3.1.5.2.5.4.1.1.1.7-.1 1.4Z"/></svg>
        <span>اطلبي الآن · <b dir="ltr" style="unicode-bidi:isolate;font-weight:900">33 65 45 23</b></span>
      </div>
    </div>
  </div>
</div>
